; GELLO leader arm with AS5600 magnetic encoders behind a TCA9548A I2C multiplexer.
; Build and flash (no Arduino IDE needed; PlatformIO fetches the toolchain on first use):
;   uvx --from platformio pio run -d firmware/as5600_leader -t upload
; Watch the stream:
;   uvx --from platformio pio device monitor -d firmware/as5600_leader
; See README.md for the wiring and the serial protocol.

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Seeed XIAO ESP32C3: SDA = D4 (GPIO6), SCL = D5 (GPIO7).
[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
; Its USB serial ignores the baud rate, and this esptool fails after switching to a faster one.
upload_speed = 115200

; Any other board: set the pins. E.g. a generic ESP32 on GPIO18/19, as in the
; open-source-leader-arm wiring diagram:
;   build_flags = ${env.build_flags} -DPIN_SDA=18 -DPIN_SCL=19
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DPIN_SDA=18 -DPIN_SCL=19
